  const diffBase = host === "github" ? pr.url + "/files" : host === "gitlab" ? pr.url + "/diffs" : null;
  const storeKey = "pr-tour:" + (pr.url || pr.repo + "#" + pr.number);

  function load() { try { return JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch (e) { return {}; } }
  let save = (state) => { try { localStorage.setItem(storeKey, JSON.stringify(state)); } catch (e) {} };
  const state = load();

  document.title = pr.title;
  document.getElementById("title").textContent = pr.title;
  document.getElementById("repo").innerHTML =
    "<b>" + esc(pr.repo) + (host ? " #" + pr.number : "") + "</b> · " + esc(pr.base) + " ← " + esc(pr.head);
  document.getElementById("summary").textContent = tour.summary;
  document.getElementById("source").textContent =
    (tour.risk_source ? "Risk badges from " + tour.risk_source + ". " : "") +
    "Generated " + new Date(tour.generated_at).toLocaleString() + ".";

  const openPr = document.getElementById("open-pr");
  if (diffBase) openPr.href = diffBase; else openPr.hidden = true;

  const stats = document.getElementById("stats");
  stats.innerHTML =
    stat("files in diff", pr.files) +
    stat("commits", pr.commits) +
    stat("added", "<b class='add'>+" + pr.additions + "</b>") +
    stat("removed", "<b class='del'>−" + pr.deletions + "</b>");
  function stat(label, value) { return "<div><span>" + label + "</span>" + (String(value).startsWith("<b") ? value : "<b>" + value + "</b>") + "</div>"; }

  const index = document.getElementById("index");
  const main = document.getElementById("chapters");
  const total = tour.chapters.reduce((n, c) => n + c.files.length, 0);

  tour.chapters.forEach((chapter, ci) => {
    const n = ci + 1;
    const id = "chapter-" + n;

    const li = document.createElement("li");
    li.id = "index-" + n;
    li.innerHTML = "<a href='#" + id + "'><span class='n'>" + pad(n) + "</span><span>" + esc(chapter.title) + "</span><span class='count'>" + chapter.files.length + "</span></a>";
    index.appendChild(li);

    const section = document.createElement("section");
    section.className = "chapter";
    section.id = id;
    section.innerHTML =
      "<header><div class='eyebrow'>" + (chapter.skim ? "Safe to skim" : "Chapter " + n + " of " + tour.chapters.length) + "</div>" +
      "<h2><span class='n'>" + pad(n) + "</span>" + esc(chapter.title) + "</h2>" +
      "<p class='lede'>" + esc(chapter.lede) + "</p>" +
      (chapter.skim ? "<div class='skim-actions'><button type='button' class='mark-all'>Mark all " + chapter.files.length + " as read</button></div>" : "") +
      "</header>" +
      (chapter.skim ? "<details class='skim'><summary>Show the " + chapter.files.length + " files</summary><ol class='files'></ol></details>" : "<ol class='files'></ol>");
    const list = section.querySelector(".files");
    if (chapter.skim) section.querySelector(".mark-all").addEventListener("click", () => {
      chapter.files.forEach((f) => { state[f.path] = true; });
      list.querySelectorAll("input[type=checkbox]").forEach((cb) => { cb.checked = true; cb.closest(".file").classList.add("read"); });
      save(state);
      updateProgress();
    });

    chapter.files.forEach((file) => {
      const item = document.createElement("li");
      item.className = "file " + file.status;
      const key = file.path;
      const checked = !!state[key];
      if (checked) item.classList.add("read");
      const slug = key.replace(/[^A-Za-z0-9]+/g, "-");
      const cbId = "read-" + slug;
      item.id = "file-" + slug;
      item.dataset.path = key;
      const risk = file.risk || { level: 0 };
      item.innerHTML =
        "<input type='checkbox' id='" + cbId + "'" + (checked ? " checked" : "") + " aria-label='Mark " + esc(file.path) + " as read'>" +
        "<div class='head'>" +
          "<span class='path'>" + pathHtml(file) + "</span>" +
          "<span class='chip'>" + esc(file.layer) + "</span>" +
          (file.status !== "modified" ? "<span class='chip status-" + file.status + "'>" + file.status + "</span>" : "") +
          "<span class='delta'><span class='add'>+" + file.additions + "</span> <span class='del'>−" + file.deletions + "</span></span>" +
          badge(risk) +
        "</div>" +
        "<p class='why'>" + esc(file.why) + "</p>" +
        (file.look_for ? "<p class='look'>" + esc(file.look_for) + "</p>" : "");
      list.appendChild(item);

      item.querySelector("input").addEventListener("change", (e) => {
        state[key] = e.target.checked;
        item.classList.toggle("read", e.target.checked);
        save(state);
        updateProgress();
      });

      const link = item.querySelector("a[data-path]");
      if (link) resolveAnchor(link, file);
    });

    main.appendChild(section);
  });

(function scatter() {
  if (!tour.scatter) return;
  const files = tour.chapters.flatMap((c) => c.files).filter((f) => f.risk && f.risk.complexity_head != null && f.risk.churn != null);
  if (files.length < 2) return;
  const land = (tour.landscape || []).filter((p) => p.churn != null && p.complexity != null);
  const pts = files.map((f) => ({
    file: f,
    x1: f.risk.churn_base != null ? f.risk.churn_base : f.risk.churn, y1: f.risk.complexity_base,
    x2: f.risk.churn, y2: f.risk.complexity_head
  }));
  const xs = pts.flatMap((p) => [p.x1, p.x2]).concat(land.map((p) => p.churn));
  const ys = pts.flatMap((p) => [p.y1, p.y2]).filter((v) => v != null).concat(land.map((p) => p.complexity));
  const xMaxData = Math.max(1, ...xs), yMaxData = Math.max(1, ...ys);
  const W = 720, H = 360, m = { t: 12, r: 16, b: 44, l: 52 };

  // Heavy-tailed repos pile everything into the corner on linear axes; start in log when the spread says so.
  const spread = (vals) => { const s = vals.filter((v) => v > 0).sort((a, b) => a - b); return s.length ? s[s.length - 1] / s[Math.floor(s.length / 2)] : 1; };
  const scaleKey = "pr-tour:scatter-scale";
  let mode = null;
  try { mode = localStorage.getItem(scaleKey); } catch (e) {}
  if (mode !== "linear" && mode !== "log") mode = (spread(xs) > 8 || spread(ys) > 8) ? "log" : "linear";

  const section = document.createElement("section");
  section.className = "chapter scatter";
  section.id = "scatter";
  section.innerHTML =
    "<header><div class='eyebrow'>Before reading</div><h2>Where the touched files moved</h2>" +
    "<p class='lede'>Each file is a trace from its position before the PR to its position after. Files that moved up added complexity. Files far to the right change often. Hover a point for the numbers; click it to go to the file.</p></header>" +
    "<div class='frame'><div class='scale' role='group' aria-label='Axis scale'><span>Scale</span><button type='button' data-mode='linear'>Linear</button><button type='button' data-mode='log'>Log</button></div><div class='plot'></div>" +
    "<div class='legend'><span><i></i>before the PR</span><span><i class='filled'></i>after the PR</span><span><i class='g'></i>grew or reworked</span><span><i class='h'></i>hotspot</span>" +
    (land.length ? "<span><i class='land'></i>files not in the PR</span>" : "") +
    "<span>New files have no before point. Files without a complexity score are not shown; the numbers are in the file rows.</span></div></div>";
  const tip = document.createElement("div");
  tip.className = "tip";
  tip.hidden = true;
  section.appendChild(tip);
  const plot = section.querySelector(".plot");
  section.querySelectorAll(".scale button").forEach((b) => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    try { localStorage.setItem(scaleKey, mode); } catch (e) {}
    draw();
  }));
  main.prepend(section);
  draw();

  function draw() {
    section.querySelectorAll(".scale button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
    const log = mode === "log";
    // log axes use log10(v + 1) so zero (new files, no base churn) still has a place
    const xStep = nice(xMaxData / 5), yStep = nice(yMaxData / 5);
    const xMax = log ? xMaxData * 1.15 : Math.ceil(xMaxData * 1.04 / xStep) * xStep;
    const yMax = log ? yMaxData * 1.15 : Math.ceil(yMaxData * 1.04 / yStep) * yStep;
    const fx = log ? (v) => Math.log10(v + 1) / Math.log10(xMax + 1) : (v) => v / xMax;
    const fy = log ? (v) => Math.log10(v + 1) / Math.log10(yMax + 1) : (v) => v / yMax;
    const sx = (v) => m.l + fx(v) * (W - m.l - m.r);
    const sy = (v) => H - m.b - fy(v) * (H - m.t - m.b);
    const xt = log ? logTicks(xMax) : ticks(xMax, xStep), yt = log ? logTicks(yMax) : ticks(yMax, yStep);

    let svg = "<svg viewBox='0 0 " + W + " " + H + "' role='img' aria-label='Churn against complexity for the files in this PR, base to head, " + mode + " scale'>";
    svg += "<g class='grid'>" + yt.map((v) => "<line x1='" + m.l + "' x2='" + (W - m.r) + "' y1='" + sy(v) + "' y2='" + sy(v) + "'/>").join("") + "</g>";
    svg += "<g class='axis'>" +
      xt.map((v) => "<text x='" + sx(v) + "' y='" + (H - m.b + 16) + "' text-anchor='middle'>" + v + "</text>").join("") +
      yt.map((v) => "<text x='" + (m.l - 8) + "' y='" + (sy(v) + 4) + "' text-anchor='end'>" + v + "</text>").join("") +
      "<text class='title' x='" + (m.l + (W - m.l - m.r) / 2) + "' y='" + (H - 6) + "' text-anchor='middle'>Churn · commits touching the file" + (log ? " · log" : "") + "</text>" +
      "<text class='title' transform='translate(12 " + (m.t + (H - m.t - m.b) / 2) + ") rotate(-90)' text-anchor='middle'>Complexity · flog" + (log ? " · log" : "") + "</text></g>";
    svg += "<g>" + land.map((p) => "<circle class='land' r='3' cx='" + sx(p.churn) + "' cy='" + sy(p.complexity) + "'/>").join("") + "</g>";
    svg += pts.map((p, i) => {
      const lvl = "l" + (p.file.risk.level || 0);
      const hasBase = p.y1 != null;
      let g = "<g class='file' data-i='" + i + "'>";
      if (hasBase && (p.x1 !== p.x2 || p.y1 !== p.y2)) g += "<line class='trace " + lvl + "' x1='" + sx(p.x1) + "' y1='" + sy(p.y1) + "' x2='" + sx(p.x2) + "' y2='" + sy(p.y2) + "'/>";
      if (hasBase) g += "<circle class='base " + lvl + "' r='5' cx='" + sx(p.x1) + "' cy='" + sy(p.y1) + "'/>";
      g += "<circle class='head " + lvl + "' r='6' cx='" + sx(p.x2) + "' cy='" + sy(p.y2) + "'/>";
      if ((p.file.risk.level || 0) === 2) g += "<text class='label' x='" + (sx(p.x2) + 9) + "' y='" + (sy(p.y2) + 4) + "'>" + esc(p.file.path.split("/").pop()) + "</text>";
      g += "<circle class='hit' r='14' cx='" + sx(p.x2) + "' cy='" + sy(p.y2) + "'/></g>";
      return g;
    }).join("");
    svg += "</svg>";
    plot.innerHTML = svg;

    plot.querySelectorAll("g.file").forEach((g) => {
      const p = pts[+g.dataset.i];
      g.addEventListener("mousemove", (e) => {
        tip.innerHTML = "<b>" + esc(p.file.path) + "</b><br>churn " + (p.y1 != null && p.x1 !== p.x2 ? p.x1 + " → " : "") + p.x2 +
          " · complexity " + (p.y1 != null ? Math.round(p.y1) + " → " : "new, ") + Math.round(p.y2);
        tip.hidden = false;
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY + 14) + "px";
      });
      g.addEventListener("mouseleave", () => { tip.hidden = true; });
      g.addEventListener("click", () => {
        const row = document.getElementById("file-" + p.file.path.replace(/[^A-Za-z0-9]+/g, "-"));
        if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
  }

  function nice(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const s = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10; return s * p; }
  function ticks(max, step) { const out = []; for (let v = 0; v <= max + 1e-9; v += step) out.push(+v.toPrecision(3)); return out; }
  function logTicks(max) { const out = [0]; for (let p = 1; p <= max; p *= 10) [1, 2, 5].forEach((k) => { if (k * p <= max) out.push(k * p); }); return out; }
})();

  if (tour.qa && tour.qa.routes && tour.qa.routes.length) {
    const qa = tour.qa;
    const urlKey = "pr-tour:base-url";
    let baseUrl = qa.base_url || "http://localhost:3000";
    try { baseUrl = localStorage.getItem(urlKey) || baseUrl; } catch (e) {}

    const section = document.createElement("section");
    section.className = "chapter qa";
    section.id = "qa";
    section.innerHTML =
      "<header><div class='eyebrow'>After reading</div>" +
      "<h2>Try it on the dev server</h2>" +
      "<p class='lede'>" +
      (qa.environment === "devcontainer" ? "The server runs in the project's devcontainer. " : "") +
      (qa.migrations ? "The PR has " + qa.migrations + " migration" + (qa.migrations === 1 ? "" : "s") + (qa.environment === "host" ? "; the server runs them on your development database. " : ". ") : "") +
      (qa.start ? "Start it with <code>" + esc(qa.start) + "</code> on the PR branch. " : "") +
      "Links open in a third tab that is reused." + (qa.source ? " Paths from " + esc(qa.source) + "." : "") + "</p></header>" +
      "<label class='base-url'><span>Base URL</span><input id='base-url' type='url' value='" + esc(baseUrl) + "' spellcheck='false'></label>" +
      "<ol class='routes'></ol>";
    const list = section.querySelector(".routes");

    qa.routes.forEach((r) => {
      const item = document.createElement("li");
      const target = r.example || r.path;
      const isGet = (r.verb || "GET").toUpperCase() === "GET";
      item.innerHTML =
        "<span class='verb" + (isGet ? "" : " other") + "'>" + esc(r.verb || "GET") + "</span>" +
        "<span class='route'>" +
          (isGet
            ? "<a target='app' data-route='" + esc(target) + "' href='" + esc(baseUrl + target) + "'>" + esc(r.path) + "</a>"
            : "<span class='mono'>" + esc(r.path) + "</span>" + (r.via ? " <span class='via'>via <a target='app' data-route='" + esc(r.via) + "' href='" + esc(baseUrl + r.via) + "'>" + esc(r.via) + "</a></span>" : "")) +
          (r.example && r.example !== r.path ? " <span class='via'>e.g. " + esc(r.example) + "</span>" : "") +
        "</span>" +
        (r.action ? "<span class='chip'>" + esc(r.action) + "</span>" : "") +
        (r.chapter ? "<a class='chip' href='#chapter-" + r.chapter + "'>ch. " + pad(r.chapter) + "</a>" : "") +
        (r.note ? "<p class='note'>" + esc(r.note) + "</p>" : "");
      list.appendChild(item);
    });

    section.querySelector("#base-url").addEventListener("change", (e) => {
      baseUrl = e.target.value.replace(/\/+$/, "");
      try { localStorage.setItem(urlKey, baseUrl); } catch (e2) {}
      section.querySelectorAll("a[data-route]").forEach((a) => { a.href = baseUrl + a.dataset.route; });
    });

    main.appendChild(section);
  }

  const skipped = document.createElement("details");
  skipped.className = "skipped";
  skipped.innerHTML =
    "<summary>" + tour.skipped.length + " file" + (tour.skipped.length === 1 ? "" : "s") + " left out of the tour</summary><ul>" +
    tour.skipped.map((s) => "<li><code>" + esc(s.path) + "</code><span>" + esc(s.reason) + "</span></li>").join("") +
    "</ul><p class='foot'>Every file in the diff is either above or here.</p>";
  main.appendChild(skipped);

  function pathHtml(file) {
    const parts = file.path.split("/");
    const base = parts.pop();
    const dir = parts.length ? "<span>" + esc(parts.join("/") + "/") + "</span>" : "";
    if (!diffBase || file.status === "deleted" && host === "gitlab") return "<span class='plain'>" + dir + esc(base) + "</span>";
    return "<a data-path='" + esc(file.path) + "' target='pr' href='" + diffBase + "'>" + dir + esc(base) + "</a>";
  }

  function badge(risk) {
    if (!risk || !risk.level) return "";
    const label = risk.label || (risk.level === 2 ? "hotspot" : "grew");
    const parts = [];
    if (risk.complexity_head != null) parts.push((risk.complexity_base != null ? Math.round(risk.complexity_base) + "→" : "") + Math.round(risk.complexity_head));
    if (risk.commits) parts.push(esc(risk.commits) + " commits");
    const num = parts.length ? "<span class='num'>" + parts.join(" · ") + "</span>" : "";
    return "<span class='badge l" + risk.level + "' title='complexity added by the PR · commits in the PR touching this file'>" + esc(label) + num + "</span>";
  }

  async function resolveAnchor(link, file) {
    if (!window.crypto || !crypto.subtle) return;
    const bytes = new TextEncoder().encode(file.path);
    let hash;
    try {
      const algo = host === "github" ? "SHA-256" : "SHA-1";
      const buf = await crypto.subtle.digest(algo, bytes);
      hash = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch (e) { return; }
    let anchor;
    if (host === "github") {
      anchor = "#diff-" + hash;
      if (file.line && file.line.new) anchor += "R" + file.line.new;
      else if (file.line && file.line.old) anchor += "L" + file.line.old;
    } else {
      anchor = "#" + hash;
      if (file.line && file.line.old != null && file.line.new != null) anchor += "_" + file.line.old + "_" + file.line.new;
    }
    link.href = diffBase + anchor;
  }

  // Two ways to count progress: files left, or share of changed lines read. Big files skew the second toward the truth.
  const progressKey = "pr-tour:progress-mode";
  let progressMode = "files";
  try { progressMode = localStorage.getItem(progressKey) || "files"; } catch (e) {}
  const lines = (f) => (f.additions || 0) + (f.deletions || 0);
  const totalLines = tour.chapters.reduce((n, c) => n + c.files.reduce((m, f) => m + lines(f), 0), 0);
  document.getElementById("progress").addEventListener("click", () => {
    progressMode = progressMode === "files" ? "lines" : "files";
    try { localStorage.setItem(progressKey, progressMode); } catch (e) {}
    updateProgress();
  });

  function updateProgress() {
    let read = 0, readLines = 0;
    tour.chapters.forEach((chapter, ci) => {
      const done = chapter.files.filter((f) => state[f.path]);
      read += done.length;
      readLines += done.reduce((m, f) => m + lines(f), 0);
      document.getElementById("index-" + (ci + 1)).classList.toggle("done", done.length === chapter.files.length);
    });
    const text = document.getElementById("progress-text");
    let ratio;
    if (progressMode === "lines") {
      ratio = totalLines ? readLines / totalLines : 0;
      text.textContent = Math.round(ratio * 100) + "% of lines read";
    } else {
      ratio = total ? read / total : 0;
      const left = total - read;
      text.textContent = left === 0 ? "all " + total + " files read" : left + " of " + total + " file" + (total === 1 ? "" : "s") + " left";
    }
    document.getElementById("progress-bar").style.width = (ratio * 100) + "%";
  }
  updateProgress();

  // Ticks live in localStorage for instant, account-free use; when the page runs inside claude.ai with
  // db + user granted, they also sync to the viewer's private subtree so they follow them across devices.
  (async function syncTicks() {
    if (!window.claude || typeof claude.use !== "function") return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const docId = storeKey.replace(/[^A-Za-z0-9_.~:@+-]+/g, "-").slice(0, 200);
    let ref;
    try { ref = db.doc("data/users/" + uid + "/pr-tour").collection("tours").doc(docId); } catch (e) { return; }

    let writing = Promise.resolve();
    let timer = null;
    const persistRemote = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        writing = writing.then(() => ref.set({ ticks: state, updated_at: new Date().toISOString() })).catch(() => {});
      }, 400);
    };
    const origSave = save;
    save = (s) => { origSave(s); persistRemote(); };

    let seeded = false;
    ref.onSnapshot((snap) => {
      if (!snap.exists) {
        if (!seeded && Object.keys(state).some((k) => state[k])) persistRemote();
        seeded = true;
        return;
      }
      seeded = true;
      const remote = (snap.data() || {}).ticks || {};
      let changed = false;
      Object.keys(remote).forEach((k) => { if (!!state[k] !== !!remote[k]) { state[k] = !!remote[k]; changed = true; } });
      if (!changed) return;
      origSave(state);
      document.querySelectorAll(".file input[type=checkbox]").forEach((cb) => {
        const li = cb.closest(".file");
        const key = li && li.dataset.path;
        if (!key) return;
        cb.checked = !!state[key];
        li.classList.toggle("read", !!state[key]);
      });
      updateProgress();
    }, () => {});
    document.getElementById("progress").title += " · ticks sync to your account";
  })();

  function pad(n) { return String(n).padStart(2, "0"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
})();
</script>
